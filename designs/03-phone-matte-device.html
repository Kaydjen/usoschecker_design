<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131314">
<title>USOS Checker — Today (Matte Device)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131314;
    --text: #eef1f3;
    --muted: #8b9297;
    --quiet: #6f767c; /* >= 4.5:1 on the well */
    --gap: 12px;       /* spacing scale: 4 / 8 / 12 / 16 / 20 / 24 */
    --line: rgba(255,255,255,.08);
    --accent: #1fc6ef; /* the only accent; used once: the indicator tick on Next class */
    --ink: #0c0d0e;
    --well: #0d0e0f;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-size: 14px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #19191b 0%, var(--bg) 55%);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  button { touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap { width: min(100% - 32px, 760px); margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 0 calc(104px + env(safe-area-inset-bottom)); }
  .grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
  @media (min-width: 640px) {
    .grid { grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: start; }
    .hero { grid-row: span 2; min-height: 100%; }
    .grid > .week { grid-column: 1 / -1; }
  }

  /* Type: small, wide-spaced capitals for labels; values larger and brighter */
  .label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--quiet); }
  .meta { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* Surfaces: a raised matte plate, and a recessed display well */
  .plate {
    border-radius: 28px; border: 1px solid rgba(255,255,255,.06);
    background: linear-gradient(180deg, #212123 0%, #171718 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 26px 44px -16px rgba(0,0,0,.95);
  }
  .well {
    border-radius: 20px; background: var(--well);
    box-shadow: inset 0 2px 10px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  /* One panel type for all three blocks: same radius, padding and header row (label left, action right) */
  .block { display: block; width: 100%; padding: 20px 20px 16px; }
  button.block { transition: transform .18s ease; }
  button.block:active { transform: scale(.99); }
  @media (hover: hover) { button.block:hover { transform: translateY(-2px); } }
  .head { display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
  .head .meta { min-height: 44px; margin: -10px -8px -10px 0; padding: 0 8px 0 16px; display: inline-flex; align-items: center; }

  /* 1. Next class: loudest by size and white text, not by a different surface */
  .hero { display: flex; flex-direction: column; }
  .hero-body { margin-top: 20px; padding-left: 16px; border-left: 2px solid var(--accent); }
  .hero-title { font-size: clamp(30px, 9vw, 36px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
  .hero-time { margin-top: 10px; font-size: 16px; letter-spacing: .04em; }
  .hero-time span { color: var(--muted); }
  .later { margin-top: auto; padding-top: 32px; }
  .later .label { margin-bottom: 4px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 13px; letter-spacing: .03em; color: var(--muted); border-top: 1px dotted rgba(255,255,255,.14); }
  .row b { color: var(--text); font-weight: 500; }

  /* 2. Needs attention: a display well, LED-style unread dots */
  .item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 0; border-top: 1px dotted rgba(255,255,255,.14); }
  .head + .item { border-top: 0; margin-top: 8px; }
  .led { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--text); box-shadow: 0 0 8px rgba(255,255,255,.55); }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .item-sub { font-size: 13px; letter-spacing: .02em; color: var(--muted); margin-top: 2px; }
  .item-end { font-size: 18px; font-weight: 500; letter-spacing: .04em; }

  /* 3. Week: same panel, round matte keys inside, dots as the only content */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 12px -4px 0; }
  .day { display: flex; flex-direction: column; align-items: center; min-height: 88px; padding: 6px 0; color: var(--muted); }
  .day .dow { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--quiet); }
  .day .key {
    margin-top: 8px; width: min(42px, 100%); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
    font-size: 15px; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #232325, #171718); border: 1px solid rgba(255,255,255,.06);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 14px -6px rgba(0,0,0,.9);
    transition: transform .18s ease;
  }
  .day:active .key { transform: scale(.94); }
  @media (hover: hover) { .day:hover .key { transform: translateY(-1px); color: var(--text); } }
  .day .dots { height: 4px; margin-top: 10px; display: flex; justify-content: center; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #3a3e42; }
  .day.today .dow { color: var(--text); }
  .day.today .key {
    color: var(--text); font-weight: 600; background: #070808;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.5);
  }
  .day.today .dots i { background: var(--text); box-shadow: 0 0 5px rgba(255,255,255,.5); }

  .note { margin-top: 24px; text-align: center; font-size: 10px; letter-spacing: .3em; line-height: 1.8; text-transform: uppercase; color: var(--quiet); opacity: .8; }

  /* Bottom bar: raised pill, active tab is pressed in (not a bright fill) */
  .nav {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 4px; border-radius: 999px;
    background: linear-gradient(180deg, #232325, #171718); border: 1px solid rgba(255,255,255,.07);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 18px 30px -10px rgba(0,0,0,.95);
  }
  .nav button { min-height: 48px; padding: 0 2px; border-radius: 999px; text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nav button:active { color: var(--text); }
  @media (hover: hover) { .nav button:hover { color: var(--text); } }
  .nav button[aria-current="page"] { color: var(--text); background: var(--well); box-shadow: inset 0 2px 6px rgba(0,0,0,.8); }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px;
    background: var(--well); color: var(--text); border: 1px solid var(--line); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="grid">

    <!-- 1. The one thing that matters now: raised plate with the next class + a display well for the rest of today -->
    <button class="well block hero" data-toast="Programming · Room 204" aria-label="Next class: Programming, 14:15 to 15:45, room 204">
      <div class="head"><span class="label">Next class</span></div>
      <div class="hero-body">
        <div class="hero-title">Programming</div>
        <div class="hero-time num">14:15–15:45 <span>· Room 204</span></div>
      </div>
      <div class="later">
        <div class="label">Later today</div>
        <div class="row"><b>Mathematics</b><span class="num">16:00 · 108</span></div>
        <div class="row"><b>Physics lab</b><span class="num">18:00 · 12</span></div>
      </div>
    </button>

    <!-- 2. Everything that changed, one display well: timetable and grades together -->
    <section class="well block" aria-label="Needs attention">
      <div class="head"><span class="label">Needs attention</span><button class="meta" data-toast="All changes">All changes →</button></div>
      <button class="item" data-toast="Room changed · 204 → 108">
        <span class="led"></span>
        <span class="item-main"><div class="item-title">Room changed</div><div class="item-sub">Mathematics · 204 → 108</div></span>
        <span class="meta">Today</span>
      </button>
      <button class="item" data-toast="Algorithms · 4.5">
        <span class="led"></span>
        <span class="item-main"><div class="item-title">New grade</div><div class="item-sub">Algorithms · Laboratory</div></span>
        <span class="item-end num">4.5</span>
      </button>
    </section>

    <!-- 3. The week at a glance: dots only, class names stay in the hero -->
    <section class="well block week" aria-label="This week">
      <div class="head">
        <span class="label">This week · 19–25 Oct</span>
        <button class="meta" data-toast="Full plan">Full plan →</button>
      </div>
      <div class="days">
        <button class="day"><span class="dow">Mon</span><span class="key">19</span><span class="dots"><i></i><i></i><i></i></span></button>
        <button class="day"><span class="dow">Tue</span><span class="key">20</span><span class="dots"><i></i><i></i></span></button>
        <button class="day"><span class="dow">Wed</span><span class="key">21</span><span class="dots"></span></button>
        <button class="day"><span class="dow">Thu</span><span class="key">22</span><span class="dots"><i></i><i></i><i></i><i></i></span></button>
        <button class="day today" aria-current="date"><span class="dow">Fri</span><span class="key">23</span><span class="dots"><i></i><i></i><i></i></span></button>
        <button class="day"><span class="dow">Sat</span><span class="key">24</span><span class="dots"></span></button>
        <button class="day"><span class="dow">Sun</span><span class="key">25</span><span class="dots"></span></button>
      </div>
    </section>

  </div>
  <p class="note">Sample content · No USOS connection</p>
</main>

<nav class="nav" aria-label="Main navigation">
  <button aria-current="page">Today</button>
  <button data-toast="Plan">Plan</button>
  <button data-toast="Grades">Grades</button>
  <button data-toast="Changes">Changes</button>
  <button data-toast="More">More</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
  const toast = document.getElementById('toast');
  let timer;
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-toast]');
    if (!el) return;
    toast.textContent = el.dataset.toast;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 1400);
  });
</script>
</body>
</html>
