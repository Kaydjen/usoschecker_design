<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0d0e">
<title>USOS Checker — Wings Approach</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d0e;
    --surface: #151618;  /* one quiet tray for every secondary section */
    --text: #eef1f3;
    --muted: #8b9297;
    --quiet: #7b8288;    /* ~4.5:1 on the tray, readable as small text */
    --line: rgba(255,255,255,.07);
    --accent: #1fc6ef;   /* the only accent; used only on Next class */
    --paper: #f4f5f6;
    --ink: #0c0d0e;
    --note: #e3c26b;     /* prototype notes only, not part of the design */
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-size: 14px; line-height: 1.45; overflow-x: hidden;
    background: radial-gradient(120% 60% at 50% 0%, #1a1b1d 0%, var(--bg) 70%);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label { font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .center { text-align: center; }
  .sep { color: var(--quiet); margin: 0 8px; }

  .top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    width: min(100% - 48px, 1180px); margin: 0 auto; padding: 20px 0;
  }
  .top .today { font-size: 13px; color: var(--muted); }
  .top .fresh { justify-self: end; font-size: 12px; color: var(--quiet); }
  .nav { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(20,21,22,.82); border: 1px solid var(--line); }
  .nav button { padding: 8px 16px; border-radius: 999px; font-size: 12px; color: var(--muted); letter-spacing: .02em; transition: color .15s; }
  @media (hover: hover) { .nav button:not([aria-current]):hover { color: var(--text); } }
  .nav button[aria-current="page"] { color: var(--ink); background: var(--paper); }

  /* Prototype-only controls */
  .demo { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px auto 0; }
  .demo button { padding: 5px 10px; border: 1px dashed rgba(255,255,255,.18); border-radius: 999px; font-size: 11px; color: var(--muted); }
  .demo button[aria-pressed="true"] { color: var(--text); border-style: solid; border-color: rgba(255,255,255,.35); }
  .demo .notes-toggle[aria-pressed="true"] { color: var(--note); border-color: var(--note); }
  .note { margin: 14px 0 0; padding: 10px 12px; border: 1px dashed var(--note); border-radius: 10px; font-size: 12.5px; line-height: 1.5; color: #d8d2c0; }
  .note b { color: var(--note); font-weight: 600; }
  body:not(.notes) .note { display: none; }
  .notes-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: min(100% - 48px, 1180px); margin: 8px auto 0; }

  /* Placement as in 01: the wings sit close to the hero, turned towards the middle and set back in space.
     Pointing at a wing makes it travel towards you; moving away sends it back. */
  .stage {
    position: relative; isolation: isolate;
    display: grid; grid-template-columns: minmax(0, 300px) minmax(380px, 420px) minmax(0, 300px); justify-content: center;
    /* The wings span both rows (hero + week) and hang from the top, so a longer list grows down beside the
       week instead of making the hero row taller and pushing the week away. Each list shows at most
       5 rows; the rest collapse into one "+N more" row, so a wing never outgrows hero + week. */
    grid-template-areas: "left focus right" "left week right";
    column-gap: 28px; row-gap: 8px; align-items: start;
    width: min(100% - 48px, 1180px); margin: 0 auto; padding: 32px 0 24px;
  }
  .stage::before {
    content: ""; position: absolute; z-index: -1; left: 50%; top: -20px; height: 520px; width: 460px; transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 42%, rgba(238,241,243,.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .focus { grid-area: focus; transition: opacity .35s ease; }
  .wing-left { grid-area: left; }
  .wing-right { grid-area: right; }
  .floor { grid-area: week; }
  /* Wing titles sit on the same line as the hero's "Next class" label */
  @media (min-width: 1100px) { .wing { margin-top: 38px; } }
  .item.more { min-height: 44px; }
  .more-text { font-size: 13px; color: var(--muted); }

  /* Why 15 looked blurry: the wings turned around their inner edge, so the outer half came towards you
     and was drawn larger than 1:1 (an upscaled picture of the text). Here, as in 01, each wing turns
     around its own centre and is pushed back, so no part of it is ever drawn larger than its real size.
     Facing you it sits at exactly 1:1, which is where the text is read. */
  /* Depth only with a mouse: on a large touch screen there is nothing to point with, so the three blocks
     stand flat and fully lit, like the narrow layout but side by side. */
  @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
    .stage { perspective: 1100px; perspective-origin: 50% 35%; }
    /* The scene is driven by script: every visible quantity (depth, angle, opacity of each block) has its own
       spring, written here as custom properties. Defaults are the rest pose: the wings hang deep in the space
       (~80% size), turned towards the middle. will-change keeps each block on its own layer, drawn once. */
    .wing { transform-origin: center center; transition: none !important; will-change: transform, opacity; }
    .wing-left  { transform: translate3d(var(--xl, 0px), var(--yl, 0px), var(--zl, -260px)) rotateY(var(--al, 30deg));  opacity: var(--ol, .8); }
    .wing-right { transform: translate3d(var(--xr, 0px), var(--yr, 0px), var(--zr, -260px)) rotateY(var(--ar, -30deg)); opacity: var(--or, .8); }
    /* The centre and its light step back together */
    .focus { transform: translateZ(var(--zf, 0px)); opacity: var(--of, 1); transition: none !important; will-change: transform, opacity; }
    .stage::before { opacity: var(--of, 1); }
  }

  /* Hero */
  .hero { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 32px 0; text-align: center; transition: transform .18s ease; }
  @media (hover: hover) { .hero:hover { transform: translateY(-2px); } }
  .hero:active { transform: scale(.99); }
  .accent-bar { width: 28px; height: 2px; background: var(--accent); margin-bottom: 14px; }
  .hero-title { font-size: 40px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 10px 0 0; }
  .hero-facts { margin-top: 12px; font-size: 15px; letter-spacing: .02em; }
  .hero-eta { margin-top: 16px; padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--accent); background: rgba(31,198,239,.1); }
  .hero.empty .hero-title { font-size: 30px; }
  .hero.empty .hero-facts { color: var(--muted); }

  .section-head { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 32px; padding: 0 4px; margin-bottom: 8px; }
  .section-head .go { font-size: 18px; line-height: 1; color: var(--quiet); transition: color .15s, transform .15s; }
  @media (hover: hover) {
    .section-head:hover .go { color: var(--text); transform: translateX(2px); }
    .section-head:hover .label { color: var(--text); }
  }
  .tray { background: var(--surface); border-radius: 14px; overflow: hidden; }
  .tray > button { position: relative; width: 100%; padding-left: 16px; padding-right: 16px; transition: background .12s; }
  .tray > button + button::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: var(--line); }
  .tray > button:active { background: rgba(255,255,255,.05); }
  @media (hover: hover) { .tray > button:hover { background: rgba(255,255,255,.03); } }

  .item { display: flex; align-items: center; gap: 12px; min-height: 60px; padding-top: 12px; padding-bottom: 12px; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-size: 15px; font-weight: 600; }
  .item-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .item-sub .sep { margin: 0 6px; }
  .item-end { font-size: 15px; font-weight: 500; white-space: nowrap; }
  .item-end .was { color: var(--muted); }
  .item-end .arrow { color: var(--quiet); margin: 0 5px; }
  .quiet-line { padding: 0 4px; font-size: 13px; color: var(--muted); }

  /* The week lies under the hero like the floor of the stage: muted, centred, no tray */
  /* Narrower than the hero column: wings at rest are pushed back, and in perspective their inner edges drift
     towards the middle (~40px). 360px leaves the week clear of a long wing even at rest. */
  .floor { width: min(100%, 360px); justify-self: center; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 0 0; }
  .day { display: flex; flex-direction: column; align-items: center; color: var(--muted); }
  .day .dow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }
  .day .date { display: grid; place-items: center; width: 34px; height: 34px; margin-top: 4px; border-radius: 50%; font-size: 15px; font-variant-numeric: tabular-nums; transition: background .12s; }
  .day .dots { height: 4px; margin-top: 4px; display: flex; justify-content: center; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--quiet); }
  .day.free .date { color: var(--quiet); }
  .day.today .dow { color: var(--text); }
  .day.today .date { background: rgba(255,255,255,.1); color: var(--text); font-weight: 600; }
  .day.today .dots i { background: var(--text); }
  @media (hover: hover) { .day:not(.today):hover .date { background: rgba(255,255,255,.06); color: var(--text); } }

  /* Narrow window: the phone column from 11, in order of importance */
  @media (max-width: 1099.98px) {
    .stage { grid-template-columns: minmax(0, 520px); grid-template-areas: "focus" "left" "right" "week"; justify-content: center; row-gap: 32px; }
    .floor { width: 100%; }
    .top { grid-template-columns: 1fr auto; }
    .top .today { display: none; }
    .notes-row { grid-template-columns: minmax(0, 520px); justify-content: center; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px;
    background: var(--paper); color: var(--ink); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">

  <nav class="nav" aria-label="Main navigation">

      <button class="day free"><span class="dow">Sat</span><span class="date">24</span><span class="dots"></span></button>

</main>

<p class="meta center" style="opacity:.6;padding:24px 0 32px">Sample content · No USOS connection</p>
<div class="toast" id="toast" role="status"></div>

<script>
  const toast = document.getElementById('toast');
  let timer;
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-toast]');
    if (!el) return;
    toast.textContent = el.dataset.toast;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 1400);
  });

  // Prototype-only: show the elements that belong to the chosen situation
  const stateButtons = document.querySelectorAll('.demo [data-state]');
  function setState(state) {
    document.querySelectorAll('[data-show]').forEach(el => {
      el.hidden = !el.dataset.show.split(' ').includes(state);
    });
    stateButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.state === state));
  }
  stateButtons.forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
  setState('today');

  // Pointer-driven scene. The pointer's horizontal position maps continuously to how far each wing
  // comes forward (no thresholds, no delays); the values then follow that target with critically damped
  // easing every frame, so slow hand = slow scene, quick flick = smooth glide, never a jump.
  const stage = document.querySelector('.stage');
  const focusBlock = stage.querySelector('.focus');
  const wide = matchMedia('(min-width: 1100px) and (hover: hover) and (pointer: fine)');
  // Reduced motion: the real app follows the system setting. In the prototype it is a switch (off by default),
  // so the motion can be seen on a machine where the system setting is on.
  let reduced = false;
  let target = 0, value = 0, velocity = 0, last = 0, running = false;   // -1 = left forward, +1 = right forward

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = t => t * t * (3 - 2 * t);
  // Layout box of the hero (not changed by transforms), so the mapping never shifts while things move.
  function targetAt(x) {
    const s = stage.getBoundingClientRect();
    const centre = s.left + focusBlock.offsetLeft + focusBlock.offsetWidth / 2;
    const half = focusBlock.offsetWidth / 2;
    const d = (x - centre) / half;             // 0 at the centre, ±1 at the hero's edges
    // Quiet zone over the middle of the hero; the wing starts coming forward from 40% of the way to the edge
    // and is fully forward a little past the edge, so it is already there when the pointer reaches it.
    const t = smooth(clamp((Math.abs(d) - .4) / .8, 0, 1));
    return Math.sign(d) * t;
  }
  // Why the earlier versions "pushed" halfway: one shared value ran from -1 to +1, and each wing's pose was
  // read off it piecewise (back → rest on one half, rest → front on the other). A wing coming from the back
  // first crawled the short back→rest stretch, then had to cover the long rest→front stretch in the same time.
  // Now the pointer only decides each block's *destination pose*, and every visible quantity springs straight
  // from where it is to where it should be, in one continuous move.
  const P = 1100;                                   // the stage perspective, px
  const sizeAt = z => P / (P - z);                  // on-screen size of something at depth z
  const depthAt = s => P * (1 - 1 / s);             // depth that gives on-screen size s
  const Z_REST = -260;
  // Forward pose keeps a little of the turn (12deg) so the wing still reads as a side panel. It stops just deep
  // enough that its nearest edge is at 1:1 (half-width × sin 12deg), so nothing is drawn enlarged.
  const A_REST = 30, A_FRONT = 12, Z_FRONT = -150 * Math.sin(A_FRONT * Math.PI / 180);
  const S_REST = sizeAt(Z_REST), S_FRONT = sizeAt(Z_FRONT), S_BACK = sizeAt(-380), S_CENTRE_BACK = sizeAt(-120);
  // Reduced-motion resting pose: halfway between rest and forward in on-screen size (81% → 89%, depth ≈ -134px)
  // and in angle (30° → 21°). Its nearest edge stays behind 1:1, and its inner edge stays clear of the week.
  const S_RM = (S_REST + S_FRONT) / 2, A_RM = (A_REST + A_FRONT) / 2;

  // Destination pose for a pointer target t (-1 left forward … +1 right forward).
  // Sizes are on-screen sizes, so equal steps look equal (perspective is undone when writing depth).
  function poseFor(t) {
    const fl = Math.max(0, -t), fr = Math.max(0, t), m = Math.abs(t);
    // Reduced motion: nothing moves or turns; only brightness follows the pointer (a fade is not motion)
    // and the wings rest halfway to the forward pose, since they never come closer to be read
    const mv = reduced ? 0 : 1;
    const sBase = reduced ? S_RM : S_REST, aBase = reduced ? A_RM : A_REST;
    const wing = (f, b, sign) => ({
      s: sBase + ((S_FRONT - S_REST) * f + (S_BACK - S_REST) * b) * mv,
      a: sign * (aBase - ((A_REST - A_FRONT) * f - 4 * b) * mv),
      o: .8 + .2 * f - .45 * b,
    });
    return {
      left: wing(fl, fr, 1),
      right: wing(fr, fl, -1),
      focus: { s: 1 + (S_CENTRE_BACK - 1) * m * mv, o: 1 - .6 * m },
    };
  }
  // One critically damped spring per quantity, with a short pre-glide of its target so a sudden
  // new destination never kicks the motion. Same stiffness everywhere, so all blocks move as one scene.
  const springs = {};
  for (const [block, pose] of Object.entries(poseFor(0)))
    for (const [k, v] of Object.entries(pose)) springs[block + '.' + k] = { x: v, v: 0, g: v, t: v };
  function setTargets(t) {
    for (const [block, pose] of Object.entries(poseFor(t)))
      for (const [k, v] of Object.entries(pose)) springs[block + '.' + k].t = v;
  }
  // Approach along the line of sight: under perspective a block that moves in depth also slides towards or
  // away from the vanishing point, which made the wings drift sideways as they came forward. Each wing is
  // shifted so its on-screen centre stays exactly where it was at rest; it only grows towards you.
  function slide(wing, z) {
    const ox = stage.offsetWidth * .5, oy = stage.offsetHeight * .35;   // = perspective-origin
    const dx = wing.offsetLeft + wing.offsetWidth / 2 - ox;
    const dy = wing.offsetTop + wing.offsetHeight / 2 - oy;
    const k = (P - z) / (P - Z_REST) - 1;
    // Horizontally 80% of the full correction: the wing still grows evenly around its place, but its inner
    // edge keeps clear of the week strip (full correction would push it ~8px over a long list's bottom rows)
    return [(dx * k * .8).toFixed(2) + 'px', (dy * k).toFixed(2) + 'px'];
  }
  const wingL = stage.querySelector('.wing-left'), wingR = stage.querySelector('.wing-right');
  function write() {
    const q = n => springs[n].x;
    const zl = depthAt(q('left.s')), zr = depthAt(q('right.s'));
    const [xl, yl] = slide(wingL, zl), [xr, yr] = slide(wingR, zr);
    stage.style.setProperty('--xl', xl); stage.style.setProperty('--yl', yl);
    stage.style.setProperty('--xr', xr); stage.style.setProperty('--yr', yr);
    stage.style.setProperty('--zl', depthAt(q('left.s')).toFixed(2) + 'px');
    stage.style.setProperty('--al', q('left.a').toFixed(3) + 'deg');
    stage.style.setProperty('--ol', q('left.o').toFixed(4));
    stage.style.setProperty('--zr', depthAt(q('right.s')).toFixed(2) + 'px');
    stage.style.setProperty('--ar', q('right.a').toFixed(3) + 'deg');
    stage.style.setProperty('--or', q('right.o').toFixed(4));
    stage.style.setProperty('--zf', depthAt(q('focus.s')).toFixed(2) + 'px');
    stage.style.setProperty('--of', q('focus.o').toFixed(4));
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
    const w = stiffness;
    let moving = false;
    for (const sp of Object.values(springs)) {
      sp.g += (sp.t - sp.g) * (1 - Math.exp(-dt * w * 1.5));
      const acc = w * w * (sp.g - sp.x) - 2 * w * sp.v;
      sp.v += acc * dt; sp.x += sp.v * dt;
      if (Math.abs(sp.t - sp.x) > 1e-4 || Math.abs(sp.v) > 1e-4) moving = true; else { sp.x = sp.g = sp.t; sp.v = 0; }
    }
    write();
    if (!moving) { running = false; return; }
    requestAnimationFrame(frame);
  }
  let stiffness = 6.6;
  function aim(t, k = 6.6) {
    target = t; stiffness = k; setTargets(t);
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  }
  // The wings follow the pointer fully inside their band (the row with the hero) and less and less
  // over a soft 160px margin above and below it, so coming in from below fades the scene in gradually
  // instead of switching at a line. Outside the band the scene drifts back to rest, slower than it came.
  const FALLOFF = 160;
  const FAST = 6.6, SLOW = 3.8;   // spring stiffness: following the pointer / drifting back
  function bandWeight(y) {
    const s = stage.getBoundingClientRect();
    // The band covers the hero and both wings (layout boxes, unaffected by the 3D pose), so a long wing
    // that reaches down beside the week still responds along its whole height
    const boxes = [focusBlock, ...stage.querySelectorAll('.wing')];
    const top = s.top + Math.min(...boxes.map(b => b.offsetTop));
    const bottom = s.top + Math.max(...boxes.map(b => b.offsetTop + b.offsetHeight));
    const out = y < top ? top - y : y > bottom ? y - bottom : 0;
    return smooth(clamp(1 - out / FALLOFF, 0, 1));
  }
  stage.addEventListener('pointermove', e => {
    if (!wide.matches) return;
    const v = bandWeight(e.clientY);
    aim(targetAt(e.clientX) * v, v < 1 ? SLOW : FAST);
  });
  stage.addEventListener('pointerleave', () => aim(0, SLOW));
  const motionToggle = document.querySelector('.motion-toggle');
  motionToggle.addEventListener('click', () => {
    reduced = !reduced;
    motionToggle.setAttribute('aria-pressed', reduced);
    aim(target, stiffness);   // re-aim so the scene settles into the new mode smoothly
  });
  // Keyboard: focusing something inside a wing brings that wing forward
  stage.addEventListener('focusin', e => {
    if (!e.target.matches(':focus-visible')) return;
    aim(e.target.closest('.wing-left') ? -1 : e.target.closest('.wing-right') ? 1 : 0);
  });
  // Prototype-only: ?active=left|right opens the page with that side already forward (for screenshots)
  const forced = new URLSearchParams(location.search).get('active');
  if (forced) {
    aim(forced === 'left' ? -1 : 1);
    for (const sp of Object.values(springs)) { sp.x = sp.g = sp.t; sp.v = 0; }
    write();
  }
  // Write the starting pose once, so a non-default resting pose (reduced motion) shows before any pointer move
  if (wide.matches && !forced) write();
  // Leaving the wide layout: drop the inline pose so the narrow column is flat again
  wide.addEventListener('change', () => {
    if (wide.matches) return;
    for (const p of ['--xl','--yl','--zl','--al','--ol','--xr','--yr','--zr','--ar','--or','--zf','--of']) stage.style.removeProperty(p);
  });
</script>
</body>
</html>
