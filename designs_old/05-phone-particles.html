<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0e">
<title>USOS Checker — Today Particles Prototype</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d0e;
    --text: #eef1f3;
    --muted: #8b9297;
    --quiet: #5c6368;
    --line: rgba(255,255,255,.09);
    --accent: #1fc6ef; /* the only accent; used once: bar on Next class */
    --paper: #f4f5f6;
    --ink: #0c0d0e;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-size: 13px; line-height: 1.45;
    background: radial-gradient(120% 70% at 50% 18%, #1a1b1d 0%, var(--bg) 62%);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .meta { font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .center { text-align: center; }

  /* Terrain: fixed, quiet depth behind everything */
  #land { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 46vh; display: block; pointer-events: none; }

  .wrap { position: relative; width: min(100% - 32px, 520px); margin: 0 auto; padding: 8px 0 120px; }

  /* 1. Hero: the ring frames the next class (card-less) */
  .hero { position: relative; display: block; width: 100%; height: 380px; text-align: center; border-radius: 28px; }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .hero-in {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 190px; display: flex; flex-direction: column; align-items: center; transition: transform .18s ease;
  }
  .hero:hover .hero-in { transform: translate(-50%, calc(-50% - 2px)); }
  .accent-bar { width: 28px; height: 2px; background: var(--accent); margin-bottom: 14px; }
  .hero-title { font-size: 30px; font-weight: 600; letter-spacing: -.015em; line-height: 1.12; margin: 8px 0 0; }
  .hero-time { margin-top: 10px; font-size: 13px; letter-spacing: .04em; }
  .hero-room { color: var(--muted); }

  .later { margin-top: 4px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--muted); padding: 7px 0; border-top: 1px solid var(--line); }
  .row b { color: var(--text); font-weight: 500; }
  .later .label { margin-bottom: 8px; }

  /* 2. Attention: card-less rows, grades and timetable together */
  .section { margin-top: 36px; }
  .item { display: flex; align-items: baseline; gap: 12px; padding: 12px 0; width: 100%; border-top: 1px solid var(--line); }
  .mark { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--text); transform: translateY(-2px); }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-size: 13px; font-weight: 600; }
  .item-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .item-end { font-size: 15px; font-weight: 500; }
  .more { margin-top: 6px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }

  /* 3. Week: dots only */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); }
  .day { padding: 12px 0 4px; text-align: center; color: var(--muted); border-radius: 4px; }
  .day:hover { color: var(--text); }
  .day .dow { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .day .date { font-size: 15px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .day .dots { height: 6px; margin-top: 8px; display: flex; justify-content: center; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--quiet); }
  .day.today { color: var(--text); box-shadow: 0 -1px 0 var(--text); }
  .day.today .date { font-weight: 600; }
  .day.today .dots i { background: var(--text); }

  .nav {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px; border-radius: 999px;
    background: rgba(20,21,22,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .nav button { padding: 8px 14px; border-radius: 999px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .nav button[aria-current="page"] { color: var(--ink); background: var(--paper); }

  .toast {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); padding: 8px 14px; border-radius: 4px;
    background: var(--paper); color: var(--ink); font-size: 11px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="land" aria-hidden="true"></canvas>

<main class="wrap">

  <!-- 1. The one thing that matters now: next class, framed by the ring -->
  <button class="hero" data-toast="Programming · Room 204" aria-label="Next class: Programming, 14:15 to 15:45, room 204">
    <canvas id="ring" aria-hidden="true"></canvas>
    <div class="hero-in">
      <div class="accent-bar"></div>
      <div class="label">Next class</div>
      <div class="hero-title">Programming</div>
      <div class="hero-time num">14:15–15:45</div>
      <div class="hero-room num">Room 204</div>
    </div>
  </button>

  <div class="later">
    <div class="label">Later today</div>
    <div class="row"><b>Mathematics</b><span class="num">16:00 · 108</span></div>
    <div class="row"><b>Physics lab</b><span class="num">18:00 · 12</span></div>
  </div>

  <!-- 2. Everything that changed: timetable and grades in one list -->
  <section class="section" aria-label="Needs attention">
    <div class="section-head"><span class="label">Needs attention</span></div>
    <button class="item" data-toast="Room changed · 204 → 108">
      <span class="mark"></span>
      <span class="item-main"><div class="item-title">Room changed</div><div class="item-sub">Mathematics · 204 → 108</div></span>
      <span class="meta">Today</span>
    </button>
    <button class="item" data-toast="Algorithms · 4.5">
      <span class="mark"></span>
      <span class="item-main"><div class="item-title">New grade</div><div class="item-sub">Algorithms · Laboratory</div></span>
      <span class="item-end num">4.5</span>
    </button>
    <button class="meta more" data-toast="All changes">All changes →</button>
  </section>

  <!-- 3. The week at a glance: dots only -->
  <section class="section" aria-label="This week">
    <div class="section-head">
      <span class="label">This week · 19–25 Oct</span>
      <button class="meta" data-toast="Full plan">Full plan →</button>
    </div>
    <div class="days">
      <button class="day"><div class="dow">Mon</div><div class="date">19</div><div class="dots"><i></i><i></i><i></i></div></button>
      <button class="day"><div class="dow">Tue</div><div class="date">20</div><div class="dots"><i></i><i></i></div></button>
      <button class="day"><div class="dow">Wed</div><div class="date">21</div><div class="dots"></div></button>
      <button class="day"><div class="dow">Thu</div><div class="date">22</div><div class="dots"><i></i><i></i><i></i><i></i></div></button>
      <button class="day today" aria-current="date"><div class="dow">Fri</div><div class="date">23</div><div class="dots"><i></i><i></i><i></i></div></button>
      <button class="day"><div class="dow">Sat</div><div class="date">24</div><div class="dots"></div></button>
      <button class="day"><div class="dow">Sun</div><div class="date">25</div><div class="dots"></div></button>
    </div>
  </section>

  <p class="meta center" style="margin-top:36px;opacity:.5">Sample content · No USOS connection</p>
</main>

<nav class="nav" aria-label="Main navigation">
  <button aria-current="page">Today</button>
  <button data-toast="Plan">Plan</button>
  <button data-toast="Grades">Grades</button>
  <button data-toast="Changes">Changes</button>
  <button data-toast="More">More</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
  const toast = document.getElementById('toast');
  let timer;
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-toast]');
    if (!el) return;
    toast.textContent = el.dataset.toast;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 1400);
  });

  // ---- Particle fields: ring around Next class + quiet terrain below ----
  const TAU = Math.PI * 2;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

  const ringEl = document.getElementById('ring'), landEl = document.getElementById('land');
  const ringCtx = ringEl.getContext('2d'), landCtx = landEl.getContext('2d');
  const ring = Array.from({ length: 3000 }, () => ({ a: Math.random() * TAU, r: gauss(), s: Math.random() < .08 ? 1.6 : 1, k: Math.random() }));
  const land = Array.from({ length: 1100 }, () => ({ u: Math.random(), v: Math.pow(Math.random(), 1.6), k: Math.random() }));

  const size = { rw: 0, rh: 0, lw: 0, lh: 0 };
  function fit(cv, cx) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [w, h];
  }
  function resize() {
    [size.rw, size.rh] = fit(ringEl, ringCtx);
    [size.lw, size.lh] = fit(landEl, landCtx);
    draw(lastT);
  }

  let lastT = 0;
  function draw(t) {
    lastT = t;

    // ring: grainy band, brighter on one side, slowly turning
    const { rw: w, rh: h } = size;
    const cx = w / 2, cy = h / 2, R = Math.min(w * .36, 150), band = R * .22, spin = t * .00006;
    ringCtx.clearRect(0, 0, w, h);
    for (const p of ring) {
      const ang = p.a + spin;
      const rr = R + p.r * band * (1 + .5 * Math.sin(ang * 2 + 1));
      const lit = .5 + .5 * Math.cos(p.a - 2.2);
      ringCtx.fillStyle = `rgba(238,241,243,${.08 + .75 * lit * lit * p.k})`;
      ringCtx.fillRect(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr * .98, p.s, p.s);
    }

    // terrain: drifting wave, brighter toward the viewer, kept faint so text stays readable
    const { lw, lh } = size;
    landCtx.clearRect(0, 0, lw, lh);
    for (const p of land) {
      const wave = Math.sin(p.u * 7 + t * .0004 + p.v * 3) * 12 + Math.sin(p.u * 17 - t * .0003) * 5;
      const y = lh * .25 + p.v * lh * .7 + wave * (1 - p.v * .5);
      const s = .8 + p.v * 1.4;
      landCtx.fillStyle = `rgba(238,241,243,${.04 + p.v * .14 * p.k})`;
      landCtx.fillRect(p.u * lw, y, s, s);
    }
  }

  addEventListener('resize', resize);
  resize();
  function loop(t) { draw(t); requestAnimationFrame(loop); }
  if (!reduced) requestAnimationFrame(loop);
</script>
</body>
</html>
