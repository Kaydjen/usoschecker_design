<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<title>USOS Checker — Today, Recommendations (Light)</title>
<style>
  :root {
    color-scheme: light;
    /* Light theme: soft grey page, near-white trays (not pure white, so large areas don't glare),
       dark grey text instead of black. Every text colour is >= 4.5:1 on both the page and the trays. */
    --bg: #eef0f2;
    --surface: #fbfbfc;  /* one quiet tray for every secondary section */
    --text: #1b1e21;
    --muted: #5b6268;    /* ~5.6:1 on the page, ~6:1 on the tray */
    --quiet: #687076;    /* ~4.5:1 on the page */
    --line: rgba(20,24,28,.08);
    --accent: #07708f;   /* the only accent; deepened cyan so it stays readable on light (~5:1) */
    --accent-mark: #12a7d4; /* same hue, brighter: only for the small non-text bar */
    --paper: #1b1e21;    /* selected nav pill and toast: dark on light */
    --ink: #ffffff;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-size: 14px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 50% at 50% 0%, #f9fafb 0%, var(--bg) 70%);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label { font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .center { text-align: center; }

  .wrap { width: min(100% - 32px, 520px); margin: 0 auto; padding: calc(8px + env(safe-area-inset-top)) 0 calc(112px + env(safe-area-inset-bottom)); }

  /* Prototype-only control: situation switch */
  .demo { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 8px; }
  .demo button { padding: 5px 10px; border: 1px dashed rgba(20,24,28,.2); border-radius: 999px; font-size: 11px; color: var(--muted); }
  .demo button[aria-pressed="true"] { color: var(--text); border-style: solid; border-color: rgba(20,24,28,.4); }


  /* R1. Data freshness: one quiet line above everything, so trust is checked in a glance */
  .fresh { margin-top: 20px; text-align: center; font-size: 12px; color: var(--quiet); }

  /* Hero: the only element standing free on the page */
  .hero { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 32px 0 36px; text-align: center; transition: transform .18s ease; }
  @media (hover: hover) { .hero:hover { transform: translateY(-2px); } }
  .hero:active { transform: scale(.99); }
  .accent-bar { width: 28px; height: 2px; background: var(--accent-mark); margin-bottom: 14px; }
  .hero-title { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 10px 0 0; }
  .hero-facts { margin-top: 12px; font-size: 15px; letter-spacing: .02em; }
  .sep { color: var(--quiet); margin: 0 8px; }
  .hero-eta { margin-top: 16px; padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--accent); background: rgba(7,112,143,.09); }
  .hero.empty .hero-title { font-size: 26px; }
  .hero.empty .hero-facts { color: var(--muted); }

  .section { margin-top: 32px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 32px; padding: 0 4px; margin-bottom: 8px; }
  .section-head .go { font-size: 18px; line-height: 1; color: var(--quiet); transition: color .15s, transform .15s; }
  @media (hover: hover) {
    .section-head:hover .go { color: var(--text); transform: translateX(2px); }
    .section-head:hover .label { color: var(--text); }
  }
  .tray { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(20,24,28,.05), 0 1px 2px rgba(20,24,28,.04); }
  .tray > button { position: relative; width: 100%; padding-left: 16px; padding-right: 16px; transition: background .12s; }
  .tray > button + button::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: var(--line); }
  .tray > button:active { background: rgba(20,24,28,.05); }
  @media (hover: hover) { .tray > button:hover { background: rgba(20,24,28,.03); } }

  /* Rows: subject on top, muted line under it. Schedule rows write "time · room" exactly as the hero does;
     change rows add the new value on the right. */
  .item { display: flex; align-items: center; gap: 12px; min-height: 60px; padding-top: 12px; padding-bottom: 12px; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-size: 15px; font-weight: 600; }
  .item-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .item-sub .sep { margin: 0 6px; }
  .item-end { font-size: 15px; font-weight: 500; white-space: nowrap; }
  .item-end .was { color: var(--muted); }
  .item-end .arrow { color: var(--quiet); margin: 0 5px; }
  /* Nothing new: one line instead of an empty tray */
  .quiet-line { padding: 0 4px; font-size: 13px; color: var(--muted); }
  /* "+N more": the last row of a capped list, quieter and lower than a real row */
  .item.more { min-height: 44px; }
  .more-text { font-size: 13px; color: var(--muted); }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 0 0; }
  .day { display: flex; flex-direction: column; align-items: center; color: var(--muted); }
  .day .dow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }
  .day .date { display: grid; place-items: center; width: 34px; height: 34px; margin-top: 4px; border-radius: 50%; font-size: 15px; font-variant-numeric: tabular-nums; }
  .day .dots { height: 4px; margin-top: 4px; display: flex; justify-content: center; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--quiet); }
  .day.free .date { color: var(--quiet); }
  .day.today .dow { color: var(--text); }
  .day.today .date { background: rgba(20,24,28,.08); color: var(--text); font-weight: 600; }
  .day.today .dots i { background: var(--text); }
  @media (hover: hover) { .day:not(.today):hover .date { background: rgba(20,24,28,.05); color: var(--text); } }

  .nav {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px; border-radius: 999px;
    background: rgba(251,251,252,.86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .nav button { padding: 9px 14px; border-radius: 999px; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .nav button[aria-current="page"] { color: var(--ink); background: var(--paper); }

  .toast {
    position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 14px; border-radius: 6px;
    background: var(--paper); color: var(--ink); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="wrap">

  <div class="demo" role="group" aria-label="Prototype state">
    <button data-state="now">Class now</button>
    <button data-state="today" aria-pressed="true">Class today</button>
    <button data-state="later">In 15 days</button>
    <button data-state="none">Nothing loaded</button>
    <button data-state="busy">Busy day</button>
  </div>

  <!-- R1. Freshness -->
  <p class="fresh num" data-show="now today later busy">Updated today, 13:37</p>
  <p class="fresh num" data-show="none">Offline · last updated Tue, 18:20</p>

  <!-- R2a. Class in progress: the hero switches to "Now" and counts down to the end -->
  <button class="hero" data-show="now" data-toast="Programming · Room 204" aria-label="Now: Programming, 14:15 to 15:45, room 204, ends in 25 minutes">
    <div class="accent-bar"></div>
    <div class="label">Now</div>
    <div class="hero-title">Programming</div>
    <div class="hero-facts num">14:15–15:45<span class="sep">·</span>Room 204</div>
    <div class="hero-eta num">Ends in 25 min</div>
  </button>

  <button class="hero" data-show="today busy" data-toast="Programming · Room 204" aria-label="Next class: Programming, today 14:15 to 15:45, room 204, starts in 38 minutes">
    <div class="accent-bar"></div>
    <div class="label">Next class</div>
    <div class="hero-title">Programming</div>
    <div class="hero-facts num">14:15–15:45<span class="sep">·</span>Room 204</div>
    <div class="hero-eta num">Starts in 38 min</div>
  </button>

  <button class="hero" data-show="later" data-toast="Sat 7 Nov · Programming" aria-label="Next class: Programming, Saturday 7 November, 9:00 to 10:30, room 204, in 15 days">
    <div class="accent-bar"></div>
    <div class="label">Next class</div>
    <div class="hero-title">Programming</div>
    <div class="hero-facts num">Sat, 7 Nov<span class="sep">·</span>09:00–10:30<span class="sep">·</span>Room 204</div>
    <div class="hero-eta num">In 15 days</div>
  </button>

  <button class="hero empty" data-show="none" data-toast="Plan" aria-label="No classes planned through 14 December. Open plan">
    <div class="accent-bar"></div>
    <div class="label">Next class</div>
    <div class="hero-title">None planned yet</div>
    <div class="hero-facts num">Checked through Mon, 14 Dec</div>
  </button>


  <!-- R3. Schedule rows written in the hero's own format -->
  <section class="section" data-show="now today busy" aria-label="Later today">
    <button class="section-head" data-toast="Today's plan" aria-label="Later today, open today's plan">
      <span class="label">Later today</span><span class="go" aria-hidden="true">›</span>
    </button>
    <div class="tray">
      <button class="item" data-show="today now" data-toast="Mathematics · Room 108" aria-label="Mathematics, 16:00 to 17:30, room 108">
        <span class="item-main"><div class="item-title">Mathematics</div><div class="item-sub num">16:00–17:30<span class="sep">·</span>Room 108</div></span>
      </button>
      <button class="item" data-show="today now" data-toast="Physics lab · Room 12" aria-label="Physics lab, 18:00 to 19:30, room 12">
        <span class="item-main"><div class="item-title">Physics lab</div><div class="item-sub num">18:00–19:30<span class="sep">·</span>Room 12</div></span>
      </button>
      <button class="item" data-show="busy" data-toast="Mathematics · Room 108"><span class="item-main"><div class="item-title">Mathematics</div><div class="item-sub num">16:00–17:30<span class="sep">·</span>Room 108</div></span></button>
      <button class="item" data-show="busy" data-toast="Physics lab · Room 12"><span class="item-main"><div class="item-title">Physics lab</div><div class="item-sub num">17:45–19:15<span class="sep">·</span>Room 12</div></span></button>
      <button class="item" data-show="busy" data-toast="Statistics · Room 31"><span class="item-main"><div class="item-title">Statistics</div><div class="item-sub num">19:30–21:00<span class="sep">·</span>Room 31</div></span></button>
      <button class="item more" data-show="busy" data-toast="Today's plan" aria-label="3 more classes today, open today's plan"><span class="item-main more-text">+3 more today</span></button>
    </div>
  </section>

  <section class="section" data-show="later" aria-label="Later that day">
    <button class="section-head" data-toast="Plan · Sat 7 Nov" aria-label="Later that day, open plan for Saturday 7 November">
      <span class="label">Later that day</span><span class="go" aria-hidden="true">›</span>
    </button>
    <div class="tray">
      <button class="item" data-toast="Mathematics · Room 108" aria-label="Mathematics, 10:45 to 12:15, room 108">
        <span class="item-main"><div class="item-title">Mathematics</div><div class="item-sub num">10:45–12:15<span class="sep">·</span>Room 108</div></span>
      </button>
      <button class="item" data-toast="Physics lab · Room 12" aria-label="Physics lab, 12:45 to 14:15, room 12">
        <span class="item-main"><div class="item-title">Physics lab</div><div class="item-sub num">12:45–14:15<span class="sep">·</span>Room 12</div></span>
      </button>
      <button class="item" data-toast="Statistics · Room 31" aria-label="Statistics, 14:30 to 16:00, room 31">
        <span class="item-main"><div class="item-title">Statistics</div><div class="item-sub num">14:30–16:00<span class="sep">·</span>Room 31</div></span>
      </button>
    </div>
  </section>

  <!-- R4. Section named like the tab it opens -->
  <section class="section" aria-label="Changes">
    <button class="section-head" data-toast="Changes" aria-label="Changes, open all changes">
      <span class="label">Changes</span><span class="go" aria-hidden="true">›</span>
    </button>
    <div class="tray" data-show="now today later busy">
      <button class="item" data-show="now today busy" data-toast="Room changed · 204 → 108" aria-label="Mathematics, room changed for today 16:00, from 204 to 108">
        <span class="item-main"><div class="item-title">Mathematics</div><div class="item-sub num">Room changed<span class="sep">·</span>Today 16:00</div></span>
        <span class="item-end num"><span class="was">204</span><span class="arrow">→</span>108</span>
      </button>
      <button class="item" data-show="later" data-toast="Room changed · 204 → 108" aria-label="Mathematics, room changed for Saturday 7 November 10:45, from 204 to 108">
        <span class="item-main"><div class="item-title">Mathematics</div><div class="item-sub num">Room changed<span class="sep">·</span>Sat 7 Nov 10:45</div></span>
        <span class="item-end num"><span class="was">204</span><span class="arrow">→</span>108</span>
      </button>
      <!-- Order: what changes today first, then grades -->
      <button class="item" data-show="busy" data-toast="Statistics · 19:30"><span class="item-main"><div class="item-title">Statistics</div><div class="item-sub num">Time changed<span class="sep">·</span>Today</div></span><span class="item-end num"><span class="was">18:00</span><span class="arrow">→</span>19:30</span></button>
      <button class="item" data-toast="Algorithms · 4.5" aria-label="Algorithms, new grade for laboratory, 4.5">
        <span class="item-main"><div class="item-title">Algorithms</div><div class="item-sub">New grade<span class="sep">·</span>Laboratory</div></span>
        <span class="item-end num">4.5</span>
      </button>
      <button class="item more" data-show="busy" data-toast="Changes" aria-label="4 more changes, open all changes"><span class="item-main more-text">+4 more changes</span></button>
    </div>
    <p class="quiet-line num" data-show="none">Nothing new since Tue, 18:20</p>
  </section>

  <section class="section" aria-label="This week">
    <button class="section-head" data-toast="Full plan" aria-label="This week, open full plan">
      <span class="label">This week · 19–25 Oct</span><span class="go" aria-hidden="true">›</span>
    </button>
    <div class="days" data-show="now today busy">
      <button class="day"><span class="dow">Mon</span><span class="date">19</span><span class="dots"><i></i><i></i><i></i></span></button>
      <button class="day"><span class="dow">Tue</span><span class="date">20</span><span class="dots"><i></i><i></i></span></button>
      <button class="day free"><span class="dow">Wed</span><span class="date">21</span><span class="dots"></span></button>
      <button class="day"><span class="dow">Thu</span><span class="date">22</span><span class="dots"><i></i><i></i><i></i><i></i></span></button>
      <button class="day today" aria-current="date"><span class="dow">Fri</span><span class="date">23</span><span class="dots"><i></i><i></i><i></i></span></button>
      <button class="day free"><span class="dow">Sat</span><span class="date">24</span><span class="dots"></span></button>
      <button class="day free"><span class="dow">Sun</span><span class="date">25</span><span class="dots"></span></button>
    </div>
    <div class="days" data-show="later none">
      <button class="day free"><span class="dow">Mon</span><span class="date">19</span><span class="dots"></span></button>
      <button class="day free"><span class="dow">Tue</span><span class="date">20</span><span class="dots"></span></button>
      <button class="day free"><span class="dow">Wed</span><span class="date">21</span><span class="dots"></span></button>
      <button class="day free"><span class="dow">Thu</span><span class="date">22</span><span class="dots"></span></button>
      <button class="day free today" aria-current="date"><span class="dow">Fri</span><span class="date">23</span><span class="dots"></span></button>
      <button class="day free"><span class="dow">Sat</span><span class="date">24</span><span class="dots"></span></button>
      <button class="day free"><span class="dow">Sun</span><span class="date">25</span><span class="dots"></span></button>
    </div>
  </section>

  <p class="meta center" style="margin-top:32px;opacity:.6">Sample content · No USOS connection</p>
</main>

<nav class="nav" aria-label="Main navigation">
  <button aria-current="page">Today</button>
  <button data-toast="Plan">Plan</button>
  <button data-toast="Grades">Grades</button>
  <button data-toast="Changes">Changes</button>
  <button data-toast="More">More</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
  const toast = document.getElementById('toast');
  let timer;
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-toast]');
    if (!el) return;
    toast.textContent = el.dataset.toast;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 1400);
  });

  // Prototype-only: show the elements that belong to the chosen situation
  const stateButtons = document.querySelectorAll('.demo [data-state]');
  function setState(state) {
    document.querySelectorAll('[data-show]').forEach(el => {
      el.hidden = !el.dataset.show.split(' ').includes(state);
    });
    stateButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.state === state));
  }
  stateButtons.forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
  setState('today');
</script>
</body>
</html>
