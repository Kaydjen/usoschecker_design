<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>USOS Checker — Design Prototype v2</title>
<style>
  :root {
    color-scheme: dark;
    --black: #000000;
    --surface: #090b09;
    --surface-2: #101310;
    --text: #f1f3f1;
    --muted: #969d97;
    --quiet: #687069;
    --line: #252a25;
    --line-strong: #373e37;
    --green: #51cf83;

  * { box-sizing: border-box; }
  html { background: var(--black); scroll-behavior: smooth; }
  body { margin: 0; background: var(--black); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; }
  button, input, select { font: inherit; }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; }
  .app-shell { width: min(100% - 42px, var(--content)); margin: 0 auto; }
  .nav { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; padding: 0 max(15px, calc((100% - var(--content)) / 2)) env(safe-area-inset-bottom); background: var(--black); border-top: 1px solid var(--line); }
  .nav-button { flex: 1 1 0; position: relative; height: 56px; border: 0; padding: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: color .15s ease; }
  .nav-button:hover { color: var(--text); }
  .nav-button[aria-current="page"] { color: var(--text); }
  .nav-button[aria-current="page"]::before { content: ""; width: 18px; height: 2px; border-radius: 0 0 2px 2px; background: var(--green); position: absolute; top: -1px; left: 50%; margin-left: -9px; }
  main { padding: 32px 0 calc(56px + 40px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .section { margin-top: 34px; }
  .section:first-child { margin-top: 0; }
  .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 12px; }
  .section-heading h2 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .105em; color: var(--muted); }
  .subtle-link { background: none; border: 0; color: var(--muted); padding: 5px 0; cursor: pointer; font-size: 11px; text-decoration: none; white-space: nowrap; }
  .subtle-link:hover { color: var(--text); }
  .arrow { display: inline-block; margin-left: 3px; transition: transform .15s ease; }

  .eyebrow { color: var(--muted); text-transform: uppercase; font-size: 10px; font-weight: 670; letter-spacing: .12em; }
  .muted { color: var(--muted); }
  .tiny { font-size: 11px; }
  .next-class { display: block; position: relative; width: 100%; padding: 20px 21px 21px; background: var(--surface); border: 1px solid var(--line); border-left: 2px solid var(--green); border-radius: var(--radius); text-align: left; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }

  .next-time { color: #d6dbd6; font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap; }
  .next-body { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
  .class-title { min-width: 0; font-size: clamp(22px, 4vw, 28px); letter-spacing: -.04em; line-height: 1.2; font-weight: 590; }
  .next-side { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; margin-left: 10px; }
  .next-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; margin-top: 11px; color: var(--muted); font-size: 11px; }
  .meta-item { display: inline-flex; align-items: center; gap: 6px; }
  .meta-item svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
  .next-chevron { flex: 0 0 auto; width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--muted); transition: color .15s, transform .15s; }
  .next-class:hover .next-chevron { color: var(--text); transform: translateX(2px); }
  .next-chevron svg { width: 15px; height: 15px; }
  .list { border-top: 1px solid var(--line); }
  .list-row { width: 100%; min-width: 0; display: flex; align-items: center; gap: 15px; padding: 13px 2px; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left; cursor: pointer; transition: background .12s; }
  .list-row:hover { background: #070907; }
  .row-time { flex: 0 0 98px; color: #d6dbd6; font-size: 11px; font-variant-numeric: tabular-nums; }
  .row-main { min-width: 0; flex: 1; }
  .row-title { color: var(--text); font-size: 13px; font-weight: 540; transition: color .15s; }
  .list-row:hover .row-title { color: #ffffff; }
  .row-sub { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .class-time { color: #d6dbd6; font-variant-numeric: tabular-nums; }
  .class-time-right { color: #d6dbd6; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; }
  .row-end { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; color: var(--muted); }
  .row-chevron { width: 14px; height: 14px; }
  .attention-list { border-top: 1px solid var(--line); }
  .attention-row { width: 100%; display: flex; align-items: start; gap: 12px; padding: 13px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
  .attention-row:hover .attention-title { color: #fff; }
  .attention-mark { width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--muted); margin-top: 7px; }
  .attention-mark.primary { background: var(--green); }
  .attention-copy { flex: 1; min-width: 0; }

  .attention-copy p { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .icon-button { flex: 0 0 auto; border: 1px solid var(--line-strong); color: var(--muted); background: transparent; width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; cursor: pointer; transition: color .12s, border-color .12s, background .12s; }
  .icon-button svg { width: 15px; height: 15px; }
  .icon-button:hover { color: var(--text); border-color: #555d55; background: var(--surface); }
  .control { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-size: 11px; cursor: pointer; }
  .control:hover { color: var(--text); border-color: var(--line-strong); }
  .control[aria-pressed="true"] { color: var(--text); background: var(--surface-2); border-color: var(--line-strong); }
  .field { background: #070907; color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; min-width: 0; font-size: 12px; }
  .field::placeholder { color: var(--quiet); }
  .toolbar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .segmented { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); background: #050605; border-radius: 10px; }
  .segmented .control { border: 0; padding: 6px 10px; border-radius: 7px; }
  .segmented .control[aria-pressed="true"] { background: var(--surface-2); }
  .segmented.change-filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; width: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; }
  .segmented.change-filters .control { display: flex; justify-content: center; height: 36px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 13px; }
  .segmented.change-filters .filter-text { position: relative; display: inline-flex; align-items: center; height: 100%; }
  .segmented.change-filters .control:hover { color: var(--text); }
  .segmented.change-filters .control[aria-pressed="true"] { background: transparent; color: var(--text); font-weight: 600; }
  .filter-count { margin-left: 5px; color: var(--quiet); font-size: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .period-row { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .period-nav { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .period-row .subtle-link { padding: 0; }
  .period-label { min-width: 0; font-size: 13px; font-weight: 580; font-variant-numeric: tabular-nums; }
  .days-strip { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 5px; margin-bottom: 18px; }
  .day-button { border: 1px solid transparent; background: transparent; color: var(--muted); padding: 8px 2px 15px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; min-width: 0; position: relative; }
  .day-button:hover { background: var(--surface); }
  .day-button[aria-pressed="true"] { color: var(--text); background: var(--surface-2); border-color: var(--line-strong); }
  .day-short { font-size: 10px; }
  .day-number { font-size: 13px; font-variant-numeric: tabular-nums; }
  .day-button.has-class::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--muted); }
  .day-button[aria-pressed="true"].has-class::after { background: var(--green); }
  .period-row .icon-button { width: 44px; height: 44px; }
  .period-center { min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; text-align: center; }
  .period-center .subtle-link { padding: 2px 0 0; }
  .schedule-group { margin: 19px 0 8px; font-size: 10px; color: var(--muted); letter-spacing: .11em; text-transform: uppercase; }
  .course-grade { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .grade-mark { display: inline-grid; place-items: center; min-width: 26px; min-height: 25px; border: 1px solid var(--line-strong); padding: 2px 6px; font-size: 11px; border-radius: 6px; color: #dfe4df; }
  .grade-mark.new { border-color: #69746a; }
  .grade-mark.pending { border-color: var(--line); color: var(--muted); }
  .grades-page { max-width: 440px; margin-left: auto; margin-right: auto; }
  .grade-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 48px); align-items: center; gap: 0; padding: 12px 2px; }
  .grade-row .row-title { display: block; padding-right: 12px; overflow-wrap: anywhere; }
  .gcell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .gcell i { font-style: normal; font-size: 10px; color: var(--muted); }
  .gcell b { position: relative; font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .gcell.pending b { color: var(--muted); font-weight: 500; }
  .gcell.new b::before { content: ""; position: absolute; left: -9px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--green); }
  .part-list { border-top: 1px solid var(--line); }
  .part-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .part-row .grade-mark { min-width: 44px; min-height: 34px; font-size: 13px; }
  .new-label { font-size: 9px; color: var(--muted); margin-left: 7px; font-weight: 650; letter-spacing: .06em; }
  .empty-state { padding: 22px 2px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .group-label { color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; margin: 26px 0 8px; }
  .tool-row { display: flex; align-items: center; gap: 13px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; width: 100%; text-align: left; border-top: 0; border-left: 0; border-right: 0; }
  .tool-row:hover .row-title { color: #fff; }
  .tool-icon { width: 24px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; color: var(--muted); }
  .tool-icon svg { width: 15px; height: 15px; }
  .footer { border-top: 1px solid var(--line); padding: 16px 0 22px; color: var(--quiet); display: flex; justify-content: space-between; gap: 12px; font-size: 9px; letter-spacing: .07em; }
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.76); display: flex; justify-content: flex-end; }
  .overlay[hidden] { display: none; }
  .drawer { width: min(100%, 440px); height: 100%; overflow-y: auto; background: #080a08; border: 1px solid var(--line-strong); border-right: 0; border-radius: 18px 0 0 18px; padding: 28px; box-shadow: -18px 0 70px rgba(0,0,0,.3); animation: slideIn .16s ease-out; }
  @keyframes slideIn { from { transform: translateX(10px); opacity: .7; } to { transform: translateX(0); opacity: 1; } }
  .drawer-top { display: flex; justify-content: space-between; gap: 15px; align-items: start; margin-bottom: 24px; }
  .drawer-title { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -.04em; margin-top: 5px; }
  .detail-facts { margin: 20px 0 0; border-top: 1px solid var(--line); }
  .fact { display: grid; grid-template-columns: 105px 1fr; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .fact dt { color: var(--muted); font-size: 11px; }
  .fact dd { margin: 0; color: var(--text); font-size: 12px; overflow-wrap: anywhere; }
  .drawer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 23px; }
  .primary-action { background: var(--surface-2); color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 13px; font-size: 12px; font-weight: 620; cursor: pointer; }
  .primary-action:hover { border-color: var(--green); }
  .secondary-action { background: transparent; color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 13px; font-size: 12px; cursor: pointer; }
  .secondary-action:hover { border-color: #5b655c; }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(56px + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #e9ede9; color: #101310; padding: 10px 14px; border-radius: 9px; font-size: 12px; font-weight: 620; box-shadow: 0 5px 25px rgba(0,0,0,.4); max-width: calc(100vw - 24px); }
  .toast[hidden] { display: none; }
  .menu-wrap { position: relative; }
  .menu-popover { position: absolute; top: calc(100% + 7px); right: 0; z-index: 10; width: 166px; background: #0b0d0b; border: 1px solid var(--line-strong); border-radius: 10px; padding: 5px; box-shadow: 0 12px 32px #000; }
  .menu-popover[hidden] { display: none; }
  .menu-item { display: block; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: transparent; color: var(--text); font-size: 12px; border-radius: 6px; cursor: pointer; }
  .menu-item:hover { background: var(--surface-2); }
  .grade-average { text-align: right; min-width: 40px; }
  .grade-average strong { font-size: 17px; font-weight: 580; font-variant-numeric: tabular-nums; }
  .grade-average span { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }

    .next-class { padding: 17px 16px 18px; }
    .class-title { font-size: 23px; }
    .row-time { flex-basis: 89px; font-size: 10px; }
    .grade-row { grid-template-columns: minmax(0, 1fr) repeat(3, 42px); }
    .drawer { width: 100%; height: min(88vh, 780px); align-self: flex-end; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 23px 20px 30px; animation: slideUp .16s ease-out; }
    @keyframes slideUp { from { transform: translateY(12px); opacity: .7; } to { transform: translateY(0); opacity: 1; } }
    .days-strip { gap: 2px; }
    .day-button { padding: 8px 0 15px; }
    .footer { font-size: 8px; }
  }
  @media (max-width: 380px) {
    .nav-button { font-size: 11px; }

    .next-class { padding: 15px 13px; }
    .class-title { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

  const courses = [

    {id:'algorithms',title:'Algorithms',start:'10:00',end:'11:30',room:'B12',teacher:'Prof. Jan Nowak',type:'Lecture',course:'Algorithms',group:'Group 1',building:'Building C',note:'',parts:[{name:'Wykład',grade:'4.5'},{name:'Ćwiczenia',grade:'4.0'}],offset:2},
    {id:'project',title:'Project workshop',start:'13:00',end:'14:30',room:'Lab 4',teacher:'Dr. Anna Kowalska',type:'Workshop',course:'Computer Science',group:'Group 2',building:'Building A',note:'',parts:[{name:'Laboratorium',grade:'5.0'}],offset:3},
    {id:'statistics',title:'Statistics',start:'08:30',end:'10:00',room:'104',teacher:'Prof. Ewa Mazur',type:'Lecture',course:'Statistics',group:'Group 1',building:'Building B',note:'',parts:[{name:'Wykład',grade:'4.5'},{name:'Ćwiczenia',grade:'4.0'}],offset:4}
  ];
  const updates = [
    {id:'room-change',title:'Room changed',detail:'Mathematics · 204 → 108',category:'Timetable',summary:'The room for Mathematics has changed.',time:'Recently',target:'math'},
    {id:'new-grade',title:'New grade',detail:'Programming · Laboratorium 5.0',category:'Grades',summary:'A new grade has been recorded for Programming.',time:'Today',target:'programming'},
    {id:'class-update',title:'Timetable updated',detail:'Databases · Time confirmed',category:'Timetable',summary:'The class details were updated.',time:'Yesterday',target:'databases'}
  ];
  const state = {page:'today', weekOffset:0, selectedDay:0, gradeSearch:'', gradeSearchOpen:false, changeFilter:'All'};
  const main = document.getElementById('mainContent');
  const overlay = document.getElementById('overlay');
  const toast = document.getElementById('toast');
  let toastTimer;
  let lastFocus = null;
  const baseToday = new Date(); baseToday.setHours(12,0,0,0);
  function esc(value) { return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dayStart(offset=0) { const d=new Date(baseToday); d.setDate(d.getDate()+state.weekOffset*7+offset); return d; }
  function dateShort(d) { return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
  function rangeLabel() { const s=dayStart(-((dayStart().getDay()+6)%7)); const e=new Date(s);e.setDate(e.getDate()+6);return `${dateShort(s)}–${dateShort(e)}`; }
  function dayName(d, short=false) { return d.toLocaleDateString('en-GB',{weekday:short?'short':'long'}); }
  function eventsForOffset(offset) { return courses.filter(c=>c.offset===offset).sort((a,b)=>a.start.localeCompare(b.start)); }
  function rowChevron() { return `<span class="row-end">${icon('chevron',14)}</span>`; }
  function sectionHeading(title, action='', command='') { return `<div class="section-heading"><h2>${title}</h2>${action?`<button class="subtle-link" data-action="${command}">${action}<span class="arrow">→</span></button>`:''}</div>`; }
  function classRow(c) { return `<button class="list-row" data-class="${c.id}" aria-label="Open ${esc(c.title)} details"><span class="row-main"><span class="row-title">${esc(c.title)}</span><span class="row-sub"><span>Room ${esc(c.room)}</span></span></span><span class="row-end"><span class="class-time-right">${c.start}–${c.end}</span>${icon('chevron',14)}</span></button>`; }
  function updateRow(u) { return `<button class="attention-row" data-update="${u.id}"><span class="attention-mark ${u.id==='room-change'?'primary':''}"></span><span class="attention-copy"><span class="attention-title">${esc(u.title)}</span><p>${esc(u.detail)}</p></span>${rowChevron()}</button>`; }
  function renderToday() {
    const todayEvents=eventsForOffset(0);
    const next=todayEvents[0];
    const actionable=updates.slice(0,2);
    main.innerHTML = `
      ${next?`<section class="section" aria-label="Next class"><button class="next-class" data-class="${next.id}" aria-label="Open details for ${esc(next.title)}"><div class="next-top"><span class="eyebrow">NEXT CLASS</span></div><div class="next-body"><div class="class-title">${esc(next.title)}</div><span class="next-side"><span class="next-time">${next.start}–${next.end}</span><span class="next-chevron">${icon('chevron',15)}</span></span></div><div class="next-meta"><span class="meta-item">Room ${esc(next.room)}</span></div></button></section>`:`<section class="section"><div class="next-class"><div class="eyebrow">NO MORE CLASSES TODAY</div><p style="margin-top:9px;color:var(--muted);font-size:12px">Your next class is on ${dayName(dayStart(1))}.</p></div></section>`}
      ${todayEvents.length>1?`<section class="section">${sectionHeading('UP NEXT','Full plan','go-plan')}<div class="list">${todayEvents.slice(1,3).map(classRow).join('')}</div></section>`:''}
      ${actionable.length?`<section class="section">${sectionHeading('NEEDS ATTENTION','All changes','go-changes')}<div class="attention-list">${actionable.map(updateRow).join('')}</div></section>`:''}`;
  }
  function renderPlan() {
    const period=rangeLabel();
    let body='';
    const dayButtons=Array.from({length:7},(_,i)=>{
      const d=dayStart(-((dayStart().getDay()+6)%7)+i);
      const offset= i-((dayStart().getDay()+6)%7);
      const actualOffset=state.selectedDay===offset?state.selectedDay:offset;
      const has=eventsForOffset(state.weekOffset*7+actualOffset).length>0;
      // weekday buttons select the matching day relative to the selected week.
      return `<button class="day-button ${has?'has-class':''}" data-day-offset="${offset}" aria-pressed="${state.selectedDay===offset}"><span class="day-short">${dayName(d,true)}</span><span class="day-number">${d.getDate()}</span></button>`;
    }).join('');
    const todays=eventsForOffset(state.weekOffset*7+state.selectedDay);
    body=`<div class="days-strip" aria-label="Choose day">${dayButtons}</div>${todays.length?`<div class="list">${todays.map(classRow).join('')}</div>`:`<div class="empty-state">No classes scheduled.</div>`}`;
    main.innerHTML=`
      <section class="section" style="margin-top:0">
        <div class="period-row"><button class="icon-button" data-action="prev-week" aria-label="Previous week">${icon('chevronLeft',15)}</button><div class="period-center"><div class="period-label">${esc(period)}</div>${state.weekOffset!==0?`<button class="subtle-link" data-action="this-week">This week</button>`:''}</div><button class="icon-button" data-action="next-week" aria-label="Next week">${icon('chevron',15)}</button></div>
        ${body}
      </section>`;
  }
  const gradeSlots=[['Wykład','Wyk.'],['Ćwiczenia','Ćw.'],['Laboratorium','Lab.']];
  function renderGrades() {
    const filtered=courses.filter(c=>`${c.title} ${c.teacher}`.toLowerCase().includes(state.gradeSearch.toLowerCase()));
    main.innerHTML=`
      <section class="section grades-page" style="margin-top:0">
        <div class="toolbar" style="justify-content:space-between;margin-bottom:20px;gap:10px">
          <select class="field" id="semesterSelect" aria-label="Choose semester"><option>Current semester</option><option>Previous semester</option><option>All semesters</option></select>
          <div class="toolbar"><button class="icon-button" data-action="grade-search" aria-label="Search courses" title="Search courses">${icon('search',15)}</button><div class="menu-wrap"><button class="icon-button" data-action="grade-menu" aria-label="More grade actions" title="More actions">${icon('more',16)}</button><div class="menu-popover" id="gradeMenu" hidden><button class="menu-item" data-action="gpa">GPA calculator</button><button class="menu-item" data-action="refresh-grades">Refresh grades</button></div></div></div>
        </div>
        <div id="gradeSearchWrap" ${state.gradeSearchOpen||state.gradeSearch?'':'hidden'} style="margin-bottom:16px"><input class="field" id="gradeSearch" style="width:100%" placeholder="Course or teacher" aria-label="Search by course or teacher" value="${esc(state.gradeSearch)}"></div>
                <div class="list">${filtered.length?filtered.map(c=>`<button class="list-row grade-row" data-course="${c.id}"><span class="row-title">${esc(c.title)}${c.isNew?'<span class="new-label">NEW</span>':''}</span>${gradeSlots.map(([k,short])=>{const p=c.parts.find(x=>x.name===k);return p?`<span class="gcell${p.isNew?' new':''}${p.grade?'':' pending'}"><i>${short}</i><b>${p.grade||'—'}</b></span>`:'<span></span>';}).join('')}</button>`).join(''):'<div class="empty-state">No courses found.</div>'}</div>
      </section>`;
    const search=document.getElementById('gradeSearch');
    if(search) search.addEventListener('input',e=>{state.gradeSearch=e.target.value;const pos=search.selectionStart;renderGrades();const next=document.getElementById('gradeSearch');next?.focus();next?.setSelectionRange(pos,pos);});
  }
  function renderChanges() {
    const filtered=updates.filter(u=>state.changeFilter==='All'||u.category===state.changeFilter);
    main.innerHTML=`<section class="section" style="margin-top:0"><div class="segmented change-filters" role="group" aria-label="Filter changes" style="margin-bottom:6px">${['All','Grades','Timetable'].map(f=>`<button class="control" data-change-filter="${f}" aria-pressed="${state.changeFilter===f}"><span class="filter-text">${f}${f==='All'?'':`<span class="filter-count">${updates.filter(u=>u.category===f).length}</span>`}</span></button>`).join('')}</div><div class="attention-list">${filtered.map((u,i)=>`<button class="attention-row" data-update="${u.id}"><span class="attention-mark ${u.id==='room-change'?'primary':''}"></span><span class="attention-copy"><span class="attention-title">${esc(u.title)}</span><p>${esc(u.detail)}</p></span><span class="row-end"><span class="muted tiny">${u.time}</span>${icon('chevron',14)}</span></button>`).join('')||'<div class="empty-state">No changes in this category.</div>'}</div></section>`;
  }
  function renderMore() {
    const groups=[
      ['UPDATES',[{title:'Change history',desc:'Grade and schedule changes',icon:'calendar',kind:'history'}]],
      ['STUDENT',[{title:'Student ID',desc:'Card status and validity',icon:'book',kind:'student-id'},{title:'Documents',desc:'Documents and decisions',icon:'book',kind:'documents'},{title:'Attendance',desc:'Absences by course',icon:'calendar',kind:'attendance'},{title:'Payments',desc:'Fees and due dates',icon:'book',kind:'payments'}]],
      ['UNIVERSITY',[{title:'News',desc:'University announcements',icon:'bell',kind:'news'},{title:'Campus & contacts',desc:'Addresses and contact details',icon:'pin',kind:'campus'}]],
      ['APP & TOOLS',[{title:'Account & settings',desc:'Connection, appearance and sync',icon:'settings',kind:'settings'},{title:'GPA calculator',desc:'Calculate a target average',icon:'calculator',kind:'gpa'},{title:'USOS API catalog',desc:'Search API methods',icon:'search',kind:'api'}]]
    ];
    main.innerHTML=groups.map(([group,items])=>`<section class="section"><div class="group-label">${group}</div>${items.map(item=>`<button class="tool-row" data-tool="${item.kind}"><span class="tool-icon">${icon(item.icon,15)}</span><span class="row-main"><span class="row-title">${item.title}</span><span class="row-sub">${item.desc}</span></span>${icon('chevron',14)}</button>`).join('')}</section>`).join('');
  }
  function render() {
    document.querySelectorAll('.nav-button').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    if(state.page==='today')renderToday();
    if(state.page==='plan')renderPlan();
    if(state.page==='grades')renderGrades();
    if(state.page==='changes')renderChanges();
    if(state.page==='more')renderMore();
  }
  function openDrawer({eyebrow='DETAILS',title='',body='',actions=[]}) {
    lastFocus=document.activeElement;
    document.getElementById('drawerEyebrow').textContent=eyebrow;
    document.getElementById('drawerTitle').textContent=title;
    document.getElementById('drawerBody').innerHTML=body+(actions.length?`<div class="drawer-actions">${actions.map(a=>`<button class="${a.primary?'primary-action':'secondary-action'}" data-action="${a.action}">${a.label}</button>`).join('')}</div>`:'');
    overlay.hidden=false;document.body.style.overflow='hidden';document.getElementById('closeDrawer').focus();
  }
  function closeDrawer(){overlay.hidden=true;document.body.style.overflow='';lastFocus?.focus?.();}
  function facts(items){return `<dl class="detail-facts">${items.map(([k,v])=>`<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v||'Not available')}</dd></div>`).join('')}</dl>`;}
  function openClass(id){
    const c=courses.find(x=>x.id===id);if(!c)return;
    openDrawer({eyebrow:c.type.toUpperCase(),title:c.title,body:`<p class="muted" style="font-size:12px">${c.start}–${c.end} · ${esc(c.course)}</p>${facts([['Teacher',c.teacher],['Room',c.room],['Building',c.building],['Class type',c.type],['Group',c.group],['Notes',c.note||'—']])}`,actions:[{label:'View in Plan',action:'class-in-plan',primary:true}]});
  }
  function openCourse(id){
    const c=courses.find(x=>x.id===id);if(!c)return;
    openDrawer({eyebrow:'COURSE',title:c.title,body:`<p class="muted" style="font-size:12px">${esc(c.teacher)}</p><div style="margin-top:23px"><div class="section-heading"><h2>COMPONENTS</h2></div><div class="part-list">${c.parts.map(p=>`<div class="part-row"><span>${esc(p.name)}${p.isNew?'<span class="new-label">NEW</span>':''}</span><span class="grade-mark${p.grade?'':' pending'}">${p.grade||'—'}</span></div>`).join('')}</div></div>${facts([['Semester','Current semester'],['Assessment dates','Open USOS for full details']])}`,actions:[{label:'GPA calculator',action:'gpa',primary:true}]});
  }
  function openUpdate(id){const u=updates.find(x=>x.id===id);if(!u)return;openDrawer({eyebrow:u.category.toUpperCase(),title:u.title,body:`<p style="font-size:13px">${esc(u.summary)}</p><p class="muted" style="font-size:12px;margin-top:8px">${esc(u.detail)}</p>${facts([['Category',u.category],['Detected',u.time],['Status','Updated']])}`,actions:[{label:u.category==='Grades'?'Open grade':'Open class',action:`open-target-${u.target}`,primary:true}]});}
  function openTool(kind){
    const info={history:['Change history','Review grade and schedule changes. Filters are available by category and change type.'], 'student-id':['Student ID','View available card status, validity and supported activation actions.'],documents:['Documents','Search, open or download a document when the university provides a file.'],attendance:['Attendance','Review recorded absences and available course limits.'],payments:['Payments','Outstanding amounts and due dates appear first, followed by the rest of the payment history.'],news:['News','Browse university announcements. Open a story to read its full contents.'],campus:['Campus & contacts','Campus address, map links, office hours and university contacts.'],settings:['Account & settings','Manage the USOS connection, appearance, language, sync and notifications.'],api:['USOS API catalog','Search methods, inspect access requirements and parameters, then review a response.'],gpa:['GPA calculator','Set a target average and estimate the grades needed in future assessments.']};
    const [title,description]=info[kind]||['Details','This section is represented as a lightweight example.'];
    openDrawer({eyebrow:'MORE',title,body:`<p style="font-size:13px;line-height:1.7">${esc(description)}</p><p class="muted" style="font-size:11px;margin-top:20px">Sample content · No USOS connection</p>`,actions:[{label:'Close',action:'close-drawer',primary:true}]});
  }
  function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2200);}
  function navigate(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});}
  function togglePlanMenu(){const menu=document.getElementById('planMenu');if(menu)menu.hidden=!menu.hidden;}
  document.getElementById('mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page);});
  document.getElementById('closeDrawer').innerHTML=icon('close',15);
  document.getElementById('closeDrawer').addEventListener('click',closeDrawer);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDrawer();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!overlay.hidden)closeDrawer();const menu=document.getElementById('planMenu');if(menu)menu.hidden=true;const gradeMenu=document.getElementById('gradeMenu');if(gradeMenu)gradeMenu.hidden=true;}});
  document.addEventListener('click',e=>{
    const cls=e.target.closest('[data-class]');if(cls){openClass(cls.dataset.class);return;}
    const course=e.target.closest('[data-course]');if(course){openCourse(course.dataset.course);return;}
    const update=e.target.closest('[data-update]');if(update){openUpdate(update.dataset.update);return;}
    const tool=e.target.closest('[data-tool]');if(tool){openTool(tool.dataset.tool);return;}
    const day=e.target.closest('[data-day-offset]');if(day){state.selectedDay=Number(day.dataset.dayOffset);renderPlan();return;}
    const filter=e.target.closest('[data-change-filter]');if(filter){state.changeFilter=filter.dataset.changeFilter;renderChanges();return;}
    const act=e.target.closest('[data-action]');if(!act)return;const key=act.dataset.action;
    if(key==='go-plan'){navigate('plan');return;}
    if(key==='go-changes'){navigate('changes');return;}
    if(key==='plan-menu'){togglePlanMenu();return;}
    if(key==='grade-menu'){const menu=document.getElementById('gradeMenu');if(menu)menu.hidden=!menu.hidden;return;}
    if(key==='prev-week'){state.weekOffset--;state.selectedDay=0;renderPlan();return;}
    if(key==='next-week'){state.weekOffset++;state.selectedDay=0;renderPlan();return;}
    if(key==='this-week'){state.weekOffset=0;state.selectedDay=0;renderPlan();return;}
    if(key==='export-schedule'){const blob=new Blob(['BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//USOS Checker Prototype//EN\nEND:VCALENDAR'],{type:'text/calendar'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='schedule.ics';a.click();URL.revokeObjectURL(url);document.getElementById('planMenu')?.setAttribute('hidden','');showToast('Sample calendar exported');return;}
    if(key==='refresh'){document.getElementById('planMenu')?.setAttribute('hidden','');showToast('Sample data is up to date');return;}
    if(key==='search-schedule'){const menu=document.getElementById('planMenu');if(menu)menu.hidden=true;const gradeMenu=document.getElementById('gradeMenu');if(gradeMenu)gradeMenu.hidden=true;openDrawer({eyebrow:'SEARCH',title:'Find a class',body:`<input id="classSearch" class="field" placeholder="Course, teacher or room" aria-label="Course, teacher or room" style="width:100%"><div id="classSearchResults" class="list" style="margin-top:14px"></div>`});const input=document.getElementById('classSearch');const result=document.getElementById('classSearchResults');const update=()=>{const q=input.value.toLowerCase();result.innerHTML=courses.filter(c=>`${c.title} ${c.teacher} ${c.room}`.toLowerCase().includes(q)).map(c=>`<button class="list-row" data-class="${c.id}"><span class="row-main"><span class="row-title">${esc(c.title)}</span><span class="row-sub">${esc(c.teacher)} · Room ${esc(c.room)}</span></span>${icon('chevron',14)}</button>`).join('');};input.addEventListener('input',update);update();setTimeout(()=>input.focus(),40);return;}
    if(key==='grade-search'){state.gradeSearchOpen=!state.gradeSearchOpen;renderGrades();if(state.gradeSearchOpen)document.getElementById('gradeSearch')?.focus();return;}
    if(key==='gpa'){document.getElementById('gradeMenu')?.setAttribute('hidden','');openTool('gpa');return;}
    if(key==='refresh-grades'){document.getElementById('gradeMenu')?.setAttribute('hidden','');showToast('Sample grades are up to date');return;}
    if(key==='class-in-plan'){closeDrawer();navigate('plan');return;}
    if(key==='close-drawer'){closeDrawer();return;}
    if(key.startsWith('open-target-')){const id=key.replace('open-target-','');closeDrawer();if(id==='programming')openCourse(id);else openClass(id);return;}
  });
  let swipeX=null;
  document.addEventListener('touchstart',e=>{swipeX=e.target.closest('.days-strip')?e.touches[0].clientX:null;},{passive:true});
  document.addEventListener('touchend',e=>{if(swipeX===null)return;const dx=e.changedTouches[0].clientX-swipeX;swipeX=null;if(Math.abs(dx)>50){state.weekOffset+=dx<0?1:-1;state.selectedDay=0;renderPlan();}},{passive:true});
  document.addEventListener('change',e=>{if(e.target.id==='semesterSelect')showToast(`${e.target.value} selected`);});
  render();
</script>
</body>
</html>
